<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手値（Tene） - ハンドメイド作家のための売値計算アプリ</title>
<meta name="description" content="ハンドメイド作品の「ちょうどいい売値」を計算し、作品・売上・資材をまとめて管理できるアプリです。Google Play で配信中。">
<style>
  :root{ --bg:#f5ede0; --surface:#ffffff; --border:#c8a97a; --accent:#b36200; --accent-dark:#7a4000; --text:#3a2a18; --sub:#7a6a55; }
  *{ box-sizing:border-box; }
  body{ margin:0; padding:2.5rem 1.25rem 3rem; background:var(--bg); color:var(--text);
        font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; line-height:1.8; }
  .wrap{ max-width:640px; margin:0 auto; }
  .card{ background:var(--surface); border:2px solid var(--border); border-radius:16px; padding:1.75rem 1.5rem; }
  h1{ font-size:1.6rem; color:var(--accent); margin:0 0 .25rem; }
  .sub{ color:var(--sub); font-size:.95rem; margin:0 0 1.5rem; }
  p{ margin:0 0 1rem; }
  .btn{ display:block; text-align:center; text-decoration:none; font-weight:900;
        padding:.95rem 1rem; border-radius:12px; margin-top:.75rem; }
  .btn-main{ background:var(--accent); color:#fff; border-bottom:4px solid var(--accent-dark); }
  .btn-sub{ background:var(--bg); color:var(--accent-dark); border:2px solid var(--border); }
  ul{ padding-left:1.2rem; margin:0 0 1.25rem; }
  li{ margin-bottom:.35rem; }
  footer{ text-align:center; color:var(--sub); font-size:.85rem; margin-top:1.5rem; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#151210; --surface:#221c17; --border:#7a5530; --accent:#ffaa44; --accent-dark:#ffcc88; --text:#f0e6da; --sub:#b3a58a; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>手値（テネ）</h1>
    <p class="sub">ハンドメイド作家のための、売値の計算と販売の記録</p>

    <p>「これ、いくらで売ればいいんだろう」<br>
    材料費と送料を入れて、作品へのこだわりを星で選ぶだけ。販売手数料を引かれても手元に残るように逆算した、おすすめの売値が出ます。</p>

    <ul>
      <li>価格計算（材料費・送料・こだわり度から売値を逆算）</li>
      <li>作品管理・売上管理・資材の在庫管理</li>
      <li>制作ログ・カレンダー・SNS用の画像づくり</li>
      <li>記録はすべて端末の中だけに保存（登録不要）</li>
    </ul>

    <p><strong>Google Play で配信中です。</strong>下のボタンからインストールできます。</p>

    <a class="btn btn-main" href="https://play.google.com/store/apps/details?id=io.github.keronimo119ui.tene">Google Play で見る</a>
    <a class="btn btn-sub" href="./privacy-policy.html">プライバシーポリシー</a>
  </div>
  <footer>Ohayou</footer>
</div>
</body>
</html>
